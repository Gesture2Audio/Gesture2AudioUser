<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture2Audio Soundscape</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07100a;
  --surface:#0d1a0f;
  --border:#1e3322;
  --text:#c4d4bb;
  --muted:#5e7a58;
  --happy:#d4a843;
  --sad:#5b8fc4;
  --neutral:#7aaa7a;
}
html,body{height:100%;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
body{
  display:flex;align-items:stretch;justify-content:stretch;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 80%,rgba(18,60,25,0.35) 0%,transparent 70%),
    radial-gradient(ellipse 50% 30% at 80% 20%,rgba(10,30,50,0.28) 0%,transparent 70%);
}
.wrap{
  width:100%;height:100%;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:var(--surface);
  display:flex;
  flex-direction:column;
}
.head{
  padding:12px 14px 8px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.title{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.12em;
  color:var(--muted);
}
.mood{
  font-size:12px;
  font-weight:600;
  color:var(--neutral);
}
.viz-wrap{position:relative;flex:1;min-height:110px}
canvas{display:block;width:100%;height:100%}
.viz-label{
  position:absolute;bottom:8px;right:12px;
  font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);
}
.status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);
}
.status-left{display:flex;align-items:center;gap:8px}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--muted);
  transition:all 0.3s ease;
}
.status-dot.playing{background:var(--neutral);box-shadow:0 0 8px var(--neutral)}
.filter-info span{
  display:inline-block;padding:2px 6px;border-radius:999px;border:1px solid currentColor;margin-left:4px;font-size:10px;
}
.filter-info.happy{color:var(--happy)}
.filter-info.sad{color:var(--sad)}
.filter-info.neutral{color:var(--neutral)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">Mood-Reactive Audio</div>
    <div class="mood" id="mood-name">Neutral</div>
  </div>
  <div class="viz-wrap">
    <canvas id="viz" height="120"></canvas>
    <span class="viz-label">waveform</span>
  </div>
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot" id="dot"></span>
      <span id="status-text">No sources active</span>
    </div>
    <div class="filter-info neutral" id="filter-info">Filter <span>-HiShelf</span></div>
  </div>
</div>

<script>
const DSP_BADGES = {
  happy: "<span>+HiShelf</span><span>+Mid</span><span>+Pres</span>",
  sad: "<span>LowPass</span><span>+Bass</span><span>-Bright</span>",
  neutral: "<span>-HiShelf</span>"
};
const FILTER_CLASSES = {
  happy: "happy",
  sad: "sad",
  neutral: "neutral"
};
const MOOD_TITLES = {
  happy: "Happy",
  sad: "Sad",
  neutral: "Neutral"
};
const MOOD_COLORS = {
  happy: "#d4a843",
  sad: "#5b8fc4",
  neutral: "#7aaa7a"
};

const state = {
  mood: "neutral",
  activeSources: [],
  statusText: "No sources active",
  phase: 0
};

const dot = document.getElementById("dot");
const statusTextNode = document.getElementById("status-text");
const filterInfo = document.getElementById("filter-info");
const moodName = document.getElementById("mood-name");
const canvas = document.getElementById("viz");
const ctx2d = canvas.getContext("2d");

function postBridgeMessage(payload) {
  if (
    window.webkit &&
    window.webkit.messageHandlers &&
    window.webkit.messageHandlers.soundscapeBridge
  ) {
    window.webkit.messageHandlers.soundscapeBridge.postMessage(payload);
  }
}

function updateStatusUI() {
  const activeCount = state.activeSources.length;
  dot.className = activeCount > 0 ? "status-dot playing" : "status-dot";
  statusTextNode.textContent = state.statusText;
  filterInfo.className = `filter-info ${FILTER_CLASSES[state.mood] || "neutral"}`;
  filterInfo.innerHTML = `Filter ${DSP_BADGES[state.mood] || DSP_BADGES.neutral}`;
  moodName.textContent = MOOD_TITLES[state.mood] || MOOD_TITLES.neutral;
  moodName.style.color = MOOD_COLORS[state.mood] || MOOD_COLORS.neutral;
}

function resizeCanvas() {
  const width = canvas.offsetWidth;
  const height = canvas.offsetHeight;
  canvas.width = width * window.devicePixelRatio;
  canvas.height = height * window.devicePixelRatio;
  ctx2d.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

function drawIdle(width, height, color) {
  ctx2d.strokeStyle = color;
  ctx2d.globalAlpha = 0.25;
  ctx2d.lineWidth = 1.5;
  ctx2d.beginPath();
  const amp = 6;
  const freq = 0.012;
  const time = Date.now() * 0.0008;
  for (let x = 0; x <= width; x++) {
    const y =
      height / 2 +
      amp * Math.sin(x * freq + time) +
      (amp * 0.4) * Math.sin(x * freq * 2.3 + time * 1.7);
    if (x === 0) {
      ctx2d.moveTo(x, y);
    } else {
      ctx2d.lineTo(x, y);
    }
  }
  ctx2d.stroke();
  ctx2d.globalAlpha = 1;
}

function drawActive(width, height, color) {
  state.phase += 0.07;
  const baseAmplitude = 14 + state.activeSources.length * 9;
  const frequencies = [0.014, 0.023, 0.031];

  ctx2d.beginPath();
  for (let x = 0; x <= width; x++) {
    const blend = frequencies.reduce((sum, frequency, index) => {
      return sum + Math.sin(x * frequency + state.phase * (index + 1));
    }, 0) / frequencies.length;
    const y = height / 2 + blend * baseAmplitude;
    if (x === 0) {
      ctx2d.moveTo(x, y);
    } else {
      ctx2d.lineTo(x, y);
    }
  }

  const gradient = ctx2d.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, `${color}55`);
  gradient.addColorStop(1, `${color}08`);

  ctx2d.lineTo(width, height);
  ctx2d.lineTo(0, height);
  ctx2d.closePath();
  ctx2d.fillStyle = gradient;
  ctx2d.fill();

  ctx2d.beginPath();
  ctx2d.lineWidth = 1.5;
  ctx2d.strokeStyle = color;
  for (let x = 0; x <= width; x++) {
    const blend = frequencies.reduce((sum, frequency, index) => {
      return sum + Math.sin(x * frequency + state.phase * (index + 1));
    }, 0) / frequencies.length;
    const y = height / 2 + blend * baseAmplitude;
    if (x === 0) {
      ctx2d.moveTo(x, y);
    } else {
      ctx2d.lineTo(x, y);
    }
  }
  ctx2d.stroke();
}

function draw() {
  requestAnimationFrame(draw);
  const width = canvas.offsetWidth;
  const height = canvas.offsetHeight;
  const color = MOOD_COLORS[state.mood] || MOOD_COLORS.neutral;

  ctx2d.clearRect(0, 0, width, height);
  if (state.activeSources.length > 0) {
    drawActive(width, height, color);
  } else {
    drawIdle(width, height, color);
  }
}

window.g2aNativeBridge = {
  notifyReady() {
    updateStatusUI();
    postBridgeMessage({ type: "ready" });
  },
  update(payload) {
    state.mood = payload && payload.mood ? payload.mood : "neutral";
    state.activeSources = payload && Array.isArray(payload.activeSources) ? payload.activeSources : [];
    state.statusText = payload && payload.statusText ? payload.statusText : "No sources active";
    updateStatusUI();
    postBridgeMessage({
      type: "state",
      activeSources: state.activeSources,
      mood: state.mood,
      statusText: state.statusText
    });
  }
};

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
updateStatusUI();
draw();
</script>
</body>
</html>
